<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spiele, Serien & Animes</title>
<style>
:root{--bg:#131421;--pn:#1c1e2e;--ln:#2c2f45;--tx:#ece9f5;--mu:#9a97b3;--ac:#9db4ff;--st:#ffbf47}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 20px}
h1{margin:0;font:700 28px Georgia,"Times New Roman",serif}
button,input,select,textarea{font:inherit;color:inherit;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px 12px}
button{cursor:pointer}
button:hover{border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);border-color:var(--ac);color:#131421;font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 16px}
.bar input{flex:1 1 200px}
#warn{display:none;background:#5a2a3a;padding:10px 20px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px 16px;padding:0 20px 48px}
.g{cursor:pointer}
.cov{position:relative;aspect-ratio:3/4;border-radius:6px;background:var(--pn);display:grid;place-items:center;font-size:40px;overflow:hidden}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cov img.bg{object-fit:cover;filter:blur(16px) brightness(.55);transform:scale(1.15)}
.badge{position:absolute;left:8px;bottom:8px;background:#131421e6;color:var(--st);font:700 22px Georgia,serif;padding:0 10px;border-radius:6px}
.g h3{margin:8px 0 2px;font-size:15px}
.mu{color:var(--mu);font-size:13px}
.avg{color:var(--st);font-weight:600}
dialog{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:12px;width:min(520px,94vw);padding:22px}
dialog::backdrop{background:#000a}
form{display:grid;gap:10px}
h2{margin:0 0 4px;font:700 22px Georgia,serif}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.rt{border-top:1px solid var(--ln);padding:8px 0}
.stars button{border:0;background:none;padding:0 1px;font-size:26px;color:#3a3e58}
.stars button.on{color:var(--st)}
textarea{width:100%}
.sl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sl input{flex:1 1 200px}
#ss{min-height:1.4em}
#pv img{display:block;max-height:140px;max-width:100%;border-radius:6px}
.hid{display:none!important}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 14px}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#131421;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{position:relative;border:1px solid var(--ln);border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer}
.chips label:has(input:checked){background:var(--ac);border-color:var(--ac);color:#131421}
.chips label:has(:focus-visible){outline:2px solid var(--ac)}
.chips input{position:absolute;opacity:0;pointer-events:none}
#sr{display:grid;gap:4px;max-height:210px;overflow:auto}
#sr button{display:flex;gap:10px;align-items:center;text-align:left}
#sr img{width:34px;height:48px;object-fit:cover;border-radius:4px}
#adm{padding:0 20px 48px}
.ur{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--ln);padding:8px 0}
#ban{background:#5a2a3a;padding:10px 20px}
</style>
</head>
<body>
<div id="warn"></div>
<div id="ban" class="hid">Account gesperrt: Du kannst nichts mehr eintragen oder bewerten.</div>
<header>
  <h1>Log</h1>
  <div class="row" style="margin:0;align-items:center">
    <button id="new" class="pri" style="display:none"></button>
    <span id="me"></span>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="bar hid" id="bar">
  <input id="q" type="search" placeholder="Titel, Genre oder Plattform suchen">
  <select id="fs"></select>
  <select id="fg"></select>
  <select id="fp"></select>
  <select id="so"><option value="rating">Beste Bewertung</option><option value="title">Titel A–Z</option><option value="new">Neueste zuerst</option></select>
</div>
<main id="grid"></main>
<section id="adm" class="hid"></section>

<dialog id="det"><div id="dc"></div></dialog>

<dialog id="add">
  <form id="af">
    <h2 id="ah"></h2>
    <div class="sl" id="stw">
      <input name="steam" placeholder="Steam-Link oder AppID (optional)">
      <button type="button" id="sc">Von Steam laden</button>
    </div>
    <div id="apiw"><input id="sq" placeholder="Titel suchen und Daten übernehmen" autocomplete="off"><div id="sr"></div></div>
    <div id="ss" class="mu"></div>
    <input name="title" placeholder="Titel" required maxlength="80">
    <input name="platform" placeholder="Plattform (PC, PS5, Switch …)" maxlength="30">
    <select name="status"></select>
    <input name="hours" type="number" min="0" step="0.5" placeholder="Spielzeit in Stunden">
    <input name="eps" type="number" min="0" step="1">
    <div class="mu">Genres (bis zu 5)</div>
    <div class="chips" id="gc"></div>
    <div class="sl"><input id="ng" maxlength="30" placeholder="Neues Genre"><button type="button" id="gb">Hinzufügen</button></div>
    <div class="chips" id="gs"></div>
    <input name="cover" type="url" placeholder="Cover-URL (https, optional)">
    <div id="pv"></div>
    <div class="row"><button class="pri" id="asv">Speichern</button><button type="button" id="ac">Abbrechen</button></div>
  </form>
</dialog>

<dialog id="lg">
  <form id="lf">
    <h2>Anmelden</h2>
    <input id="em" type="email" placeholder="E-Mail" required>
    <input id="pw" type="password" placeholder="Passwort (mind. 6 Zeichen)" required minlength="6">
    <div class="row"><button class="pri">Anmelden</button><button type="button" id="rg">Neu registrieren</button></div>
    <button type="button" id="go">Mit Google anmelden</button>
    <button type="button" id="lc">Abbrechen</button>
  </form>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut,GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,getDoc,updateDoc,deleteDoc,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyCVWnMVYeR7byiuKqWUc5ByRTwuRS2kcz8",authDomain:"spiele-serien-log.firebaseapp.com",projectId:"spiele-serien-log",appId:"1:511775992677:web:f6e16f38e0f6a6a89a0f8c"};

const T={
 games:{n:"Spiele",one:"Spiel",e:"🎮",st:["gespielt","spiele ich","Wunschliste"],g:["Action","Abenteuer","Rollenspiel","Shooter","Strategie","Simulation","Sport","Rennspiel","Puzzle","Horror","Jump 'n' Run","Indie","Survival","Sandbox","Kampfspiel"]},
 series:{n:"Serien",one:"Serie",e:"📺",st:["gesehen","schaue ich","Wunschliste"],g:["Drama","Comedy","Krimi","Thriller","Sci-Fi","Fantasy","Horror","Action","Abenteuer","Romantik","Dokumentation","Mystery","Animation","Historie"]},
 animes:{n:"Animes",one:"Anime",e:"🍥",st:["gesehen","schaue ich","Wunschliste"],g:["Action","Abenteuer","Comedy","Drama","Fantasy","Sci-Fi","Romantik","Slice of Life","Horror","Mystery","Sport","Übernatürlich","Psychologisch","Mecha","Isekai"]}
};
// Genres der APIs (Englisch) auf die deutschen Listen abbilden; alles andere wird nur vorgeschlagen
const GM={Action:"Action",Adventure:"Abenteuer",Comedy:"Comedy",Crime:"Krimi",Drama:"Drama",Fantasy:"Fantasy",Horror:"Horror",Mystery:"Mystery",Romance:"Romantik","Science-Fiction":"Sci-Fi","Sci-Fi":"Sci-Fi",Thriller:"Thriller",Suspense:"Thriller","Slice of Life":"Slice of Life",Sports:"Sport",Supernatural:"Übernatürlich",History:"Historie",Documentary:"Dokumentation",Animation:"Animation",Mecha:"Mecha",Isekai:"Isekai",Psychological:"Psychologisch",RPG:"Rollenspiel",Strategy:"Strategie",Shooter:"Shooter",Simulation:"Simulation",Puzzle:"Puzzle",Racing:"Rennspiel",Platformer:"Jump 'n' Run",Fighting:"Kampfspiel",Indie:"Indie"};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let user=null,adm=false,banned=false,tab="games",items=[],ratings=[],gen=[],us=[],cur=null,pick=0,editId=null,sel=new Set(),hits=[],tm,unE,unR,unG,unA,unM;
const cache=new Map();
const fail=e=>{$("#warn").textContent="Fehler: "+(e.code||e.message);$("#warn").style.display="block"};
const name=()=>user.displayName||user.email.split("@")[0];
const gl=g=>g.genres||(g.genre?[g.genre]:[]);
const rOf=id=>ratings.filter(r=>r.gameId===id);
const avg=id=>{const r=rOf(id);return r.length?r.reduce((a,b)=>a+b.stars,0)/r.length:0};
const canW=()=>!!user&&(adm||!banned);
const meta=g=>[tab==="games"&&g.platform,gl(g).join(", "),g.status,g.hours?g.hours+" h":"",g.eps?g.eps+(tab==="series"?" Staffeln":" Folgen"):""].filter(Boolean).map(x=>esc(x)).join(" · ");
const genres=()=>[...new Set([...T[tab].g,...gen.filter(x=>x.cat===tab).map(x=>x.name)])].sort((a,b)=>a.localeCompare(b));

// Listener: Einträge nur für den aktiven Reiter, Bewertungen und Genres einmal pro Login
function listen(){unE&&unE();items=[];render();unE=onSnapshot(collection(db,tab),s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render()},fail)}
function stop(){[unE,unR,unG,unA,unM].forEach(f=>f&&f());unE=unR=unG=unA=unM=null;items=[];ratings=[];gen=[]}
function start(){
  unR=onSnapshot(collection(db,"ratings"),s=>{ratings=s.docs.map(d=>({id:d.id,...d.data()}));render();if($("#det").open&&cur)updRl()},fail);
  unG=onSnapshot(collection(db,"genres"),s=>{gen=s.docs.map(d=>({id:d.id,...d.data()}));if($("#add").open)chips();if(tab==="admin")admR()},fail);
  unM=onSnapshot(doc(db,"users",user.uid),s=>{banned=!!s.data()?.banned;$("#ban").classList.toggle("hid",!banned||adm);$("#new").style.display=tab!=="admin"&&canW()?"":"none"},fail);
}

function tabs(){$("#tabs").innerHTML=Object.entries(T).map(([k,v])=>`<button data-t="${k}" class="${k===tab?"on":""}">${v.n}</button>`).join("")+(adm?`<button data-t="admin" class="${tab==="admin"?"on":""}">Admin</button>`:"")}
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(b&&user)setTab(b.dataset.t)};
function setTab(t){
  tab=t;tabs();const a=t==="admin";
  ["#bar","#grid"].forEach(s=>$(s).classList.toggle("hid",a));$("#adm").classList.toggle("hid",!a);
  $("#new").style.display=!a&&canW()?"":"none";
  unE&&unE();unE=null;unA&&unA();unA=null;
  if(a){unA=onSnapshot(collection(db,"users"),s=>{us=s.docs.map(d=>({id:d.id,...d.data()}));admR()},fail);admR();return}
  $("#new").textContent=T[t].one+" eintragen";$("#q").value="";
  $("#fs").innerHTML='<option value="">Alle Status</option>'+T[t].st.map(x=>`<option>${x}</option>`).join("");
  $("#fp").classList.toggle("hid",t!=="games");$("#fg").value="";$("#fp").value="";listen();
}

function fill(sel,vals,all){const e=$(sel),v=e.value;e.innerHTML=`<option value="">${all}</option>`+[...new Set(vals)].filter(Boolean).sort().map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("")}
function render(){
  if(tab==="admin")return;
  fill("#fg",items.flatMap(gl),"Alle Genres");fill("#fp",items.map(g=>g.platform),"Alle Plattformen");
  const q=$("#q").value.toLowerCase(),st=$("#fs").value,ge=$("#fg").value,pl=$("#fp").value,so=$("#so").value;
  const l=items.filter(g=>(!q||(g.title+" "+gl(g).join(" ")+" "+(g.platform||"")).toLowerCase().includes(q))&&(!st||g.status===st)&&(!ge||gl(g).includes(ge))&&(!pl||g.platform===pl));
  l.sort({rating:(a,b)=>avg(b.id)-avg(a.id),title:(a,b)=>a.title.localeCompare(b.title),new:(a,b)=>(b.createdAt?.seconds||9e9)-(a.createdAt?.seconds||9e9)}[so]);
  $("#grid").innerHTML=l.map(g=>{const n=rOf(g.id).length;
    return `<div class="g" data-id="${esc(g.id)}"><div class="cov">${T[tab].e}${g.cover?`<img class="bg" src="${esc(g.cover)}" alt="" loading="lazy" onerror="this.parentNode.querySelectorAll('img').forEach(i=>i.remove())"><img src="${esc(g.cover)}" alt="" loading="lazy">`:""}${n?`<span class="badge">${avg(g.id).toFixed(1)}</span>`:""}</div><h3>${esc(g.title)}</h3><div class="mu">${meta(g)}${n?` · ${n}× bewertet`:""}</div></div>`}).join("")||`<p class="mu">Noch keine Einträge. Trag den ersten ein.</p>`;
}
["#q","#fs","#fg","#fp","#so"].forEach(s=>$(s).oninput=render);
$("#grid").onclick=e=>{const c=e.target.closest(".g");if(c)showDet(c.dataset.id)};

function updRl(){const r=rOf(cur.id);
  $("#rl").innerHTML=r.length?`<p><span class="avg">★ ${avg(cur.id).toFixed(1)} / 10</span> <span class="mu">aus ${r.length} Bewertung${r.length>1?"en":""}</span></p>`+r.map(x=>`<div class="rt"><b>${esc(x.name)}</b> <span class="avg">${x.stars}/10</span>${adm?` <button data-rd="${esc(x.id)}">Löschen</button>`:""}<br><span class="mu">${esc(x.comment)}</span></div>`).join(""):`<p class="mu">Noch keine Bewertungen.</p>`}
function stars(){$("#st").innerHTML=Array.from({length:10},(_,i)=>`<button type="button" data-v="${i+1}" aria-label="${i+1} von 10" class="${i<pick?"on":""}">★</button>`).join("")+`<span class="mu"> ${pick||"–"}/10</span>`}

function showDet(id){
  cur=items.find(g=>g.id===id);if(!cur)return;
  const mine=rOf(id).find(r=>r.uid===user.uid),may=(cur.addedBy===user.uid&&!banned)||adm;pick=mine?.stars||0;
  $("#dc").innerHTML=`<h2>${esc(cur.title)}</h2><p class="mu">${meta(cur)} · eingetragen von ${esc(cur.addedByName)}</p><div id="rl"></div>`+
  (canW()?`<h4>Deine Bewertung</h4><div class="stars" id="st"></div><textarea id="cm" rows="2" maxlength="300" placeholder="Kurzer Kommentar">${esc(mine?.comment)}</textarea><div class="row"><button class="pri" id="sv">Bewertung speichern</button>${may?`<button id="ed">Bearbeiten</button><button id="dl">Löschen</button>`:""}<button id="cl">Schließen</button></div>`
  :`<p class="mu">Account gesperrt.</p><button id="cl">Schließen</button>`);
  updRl();$("#cl").onclick=()=>$("#det").close();
  $("#rl").onclick=e=>{const b=e.target.closest("[data-rd]");if(b&&confirm("Bewertung löschen?"))deleteDoc(doc(db,"ratings",b.dataset.rd)).catch(fail)};
  if(canW()){stars();
    $("#st").onclick=e=>{const b=e.target.closest("button");if(b){pick=+b.dataset.v;stars()}};
    $("#sv").onclick=()=>{if(!pick)return alert("Bitte 1–10 Sterne wählen.");
      setDoc(doc(db,"ratings",id+"_"+user.uid),{gameId:id,uid:user.uid,name:name(),stars:pick,comment:$("#cm").value.trim(),updatedAt:serverTimestamp()}).catch(fail)};
    const ed=$("#ed");if(ed)ed.onclick=()=>{$("#det").close();openForm(cur)};
    const d=$("#dl");if(d)d.onclick=async()=>{if(confirm("Wirklich löschen?")){await deleteDoc(doc(db,tab,id)).catch(fail);$("#det").close()}};
  }
  if(!$("#det").open)$("#det").showModal();
}

//#region steam
// Cover von Steam holen: mehrere Wege nacheinander, jedes Bild wird vor dem Speichern auf Ladbarkeit geprüft.
const STEAM_OK=/^https:\/\/[a-z0-9.-]+\.(steamstatic\.com|akamaihd\.net)\//i;
const STEAM_ASSETS="https://shared.fastly.steamstatic.com/store_item_assets/";
const STEAM_HOSTS=["https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/","https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/","https://cdn.cloudflare.steamstatic.com/steam/apps/"];
// Öffentliche CORS-Proxys als Ersatzweg, weil Steam-APIs im Browser nicht direkt erreichbar sind.
const PROXIES=[u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u),u=>"https://corsproxy.io/?url="+encodeURIComponent(u)];
const parseApp=s=>{s=String(s||"").trim();const m=s.match(/\/app\/(\d+)/)||s.match(/^(\d{2,10})$/);return m?m[1]:null};
const tmo=ms=>{const c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal};
const probe=u=>new Promise(res=>{const i=new Image(),t=setTimeout(()=>res(false),7000);i.onload=()=>{clearTimeout(t);res(true)};i.onerror=()=>{clearTimeout(t);res(false)};i.src=u});
// Fragt direkt und über alle Proxys gleichzeitig, der erste brauchbare Treffer gewinnt.
const anyJson=(u,ok)=>Promise.any([u,...PROXIES.map(p=>p(u))].map(async x=>{const r=await fetch(x,{signal:tmo(8000)});if(!r.ok)throw 0;const j=await r.json();if(!ok(j))throw 0;return j}));
async function steamLookup(id){
  const inp=encodeURIComponent(JSON.stringify({ids:[{appid:+id}],context:{language:"german",country_code:"DE"},data_request:{include_assets:true}}));
  const [a,b]=await Promise.allSettled([
    anyJson("https://api.steampowered.com/IStoreBrowseService/GetItems/v1?input_json="+inp,j=>j?.response?.store_items?.[0]?.assets),
    anyJson("https://store.steampowered.com/api/appdetails?appids="+id+"&l=german",j=>j?.[id]?.success)]);
  const it=a.value?.response?.store_items?.[0],d=b.value?.[id]?.data;
  const c=[],add=(u,how)=>{if(u&&STEAM_OK.test(u))c.push([u,how])};
  const as=it?.assets,fmt=as?.asset_url_format;
  const fromAsset=k=>as?.[k]&&fmt?STEAM_ASSETS+fmt.replace("${FILENAME}",as[k]):"";
  add(fromAsset("library_capsule"),"Hochformat");
  STEAM_HOSTS.forEach(h=>add(h+id+"/library_600x900.jpg","Hochformat"));
  add(fromAsset("header"),"Titelbild, Querformat");
  add(d?.header_image,"Titelbild, Querformat");
  STEAM_HOSTS.forEach(h=>add(h+id+"/header.jpg","Titelbild, Querformat"));
  const seen=new Set(),list=c.filter(([u])=>!seen.has(u)&&seen.add(u));
  const ok=await Promise.all(list.map(([u])=>probe(u)));
  const hit=list.find((_,i)=>ok[i]);
  return{name:(d?.name||it?.name||"").slice(0,80),cover:hit?hit[0]:"",how:hit?hit[1]:"",api:!!(it||d)};
}
//#endregion

// Genres: Startliste im Code + eigene aus Firestore
function chips(){const all=[...new Set([...genres(),...sel])].sort((a,b)=>a.localeCompare(b));
  $("#gc").innerHTML=all.map(x=>`<label><input type="checkbox" value="${esc(x)}"${sel.has(x)?" checked":""}>${esc(x)}</label>`).join("")}
$("#gc").onchange=e=>{const i=e.target;if(i.checked){if(sel.size>=5){i.checked=false;$("#ss").textContent="Maximal 5 Genres.";return}sel.add(i.value)}else sel.delete(i.value)};
async function addG(n){n=n.trim().replace(/\s+/g," ").slice(0,30);if(n.length<2)return;
  const ex=genres().find(x=>x.toLowerCase()===n.toLowerCase());
  if(!ex){const slug=n.toLowerCase().replace(/[\/\s.#]+/g,"-");await setDoc(doc(db,"genres",tab+"_"+slug),{cat:tab,name:n,slug}).catch(fail)}
  if(sel.size<5)sel.add(ex||n);chips()}
$("#gb").onclick=()=>{addG($("#ng").value);$("#ng").value=""};
$("#ng").onkeydown=$("#sq").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(e.target.id==="ng")$("#gb").click()}};
$("#gs").onclick=e=>{const l=e.target.closest("[data-s]");if(l){addG(l.dataset.s);l.remove()}};

// Suche: TVmaze (Serien), Jikan (Animes), nur https-Bilder
const https=u=>u?String(u).replace(/^http:/,"https:"):"";
async function tvm(q){const r=await fetch("https://api.tvmaze.com/search/shows?q="+encodeURIComponent(q));if(!r.ok)throw 0;
  return(await r.json()).slice(0,8).map(({show:s})=>({title:(s.name||"").slice(0,80),year:(s.premiered||"").slice(0,4),thumb:https(s.image?.medium),big:https(s.image?.original||s.image?.medium),genres:s.genres||[]}))}
async function jik(q){const r=await fetch("https://api.jikan.moe/v4/anime?limit=8&sfw=true&q="+encodeURIComponent(q));if(!r.ok)throw 0;
  return(await r.json()).data.map(a=>({title:(a.title_english||a.title||"").slice(0,80),year:a.year||a.aired?.prop?.from?.year||"",thumb:https(a.images?.jpg?.image_url),big:https(a.images?.jpg?.large_image_url||a.images?.jpg?.image_url),eps:a.episodes||"",genres:(a.genres||[]).map(g=>g.name)}))}
// Animes: AniList (stabil, kein Key), bei Fehler Jikan als Ersatz
async function ani(q){const r=await fetch("https://graphql.anilist.co",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({query:"query($q:String){Page(perPage:8){media(search:$q,type:ANIME,isAdult:false,sort:SEARCH_MATCH){title{romaji english}seasonYear episodes genres coverImage{medium large}}}}",variables:{q}})});
  if(!r.ok)throw 0;return(await r.json()).data.Page.media.map(a=>({title:(a.title.english||a.title.romaji||"").slice(0,80),year:a.seasonYear||"",thumb:https(a.coverImage?.medium),big:https(a.coverImage?.large||a.coverImage?.medium),eps:a.episodes||"",genres:a.genres||[]}))}
const anime=async q=>{try{return await ani(q)}catch{return await jik(q)}};
// Spiele-Suche: ohne Key über Steam (nur PC-Spiele), mit RAWG-Key auch Konsolen inkl. Genres
const RAWG_KEY="ebbe65df8c96481386f181453abf3204"; // optional: kostenloser Key von rawg.io/apidocs
async function gam(q){
  if(RAWG_KEY){const r=await fetch("https://api.rawg.io/api/games?page_size=8&search="+encodeURIComponent(q)+"&key="+RAWG_KEY);if(!r.ok)throw 0;
    return(await r.json()).results.map(g=>({title:(g.name||"").slice(0,80),year:(g.released||"").slice(0,4),thumb:https(g.background_image),big:https(g.background_image),genres:(g.genres||[]).map(x=>x.name)}))}
  const j=await anyJson("https://store.steampowered.com/api/storesearch/?l=german&cc=DE&term="+encodeURIComponent(q),j=>j?.items);
  return j.items.slice(0,8).map(i=>({title:(i.name||"").slice(0,80),year:"PC",thumb:https(i.tiny_image),genres:[],platform:"PC",steam:i.id}))}
$("#sq").oninput=e=>{clearTimeout(tm);const q=e.target.value.trim();if(q.length<2){$("#sr").innerHTML="";return}tm=setTimeout(()=>search(q),500)};
async function search(q){const s=$("#ss"),k=tab+"|"+q.toLowerCase();s.textContent="Suche …";
  try{let r=cache.get(k);if(!r){r=await(tab==="series"?tvm:tab==="animes"?anime:gam)(q);cache.set(k,r)}
    hits=r;s.textContent=r.length?"":"Keine Treffer. Du kannst den Titel auch von Hand eintragen.";
    $("#sr").innerHTML=r.map((x,i)=>`<button type="button" data-i="${i}">${x.thumb?`<img src="${esc(x.thumb)}" alt="">`:""}<span>${esc(x.title)}<br><span class="mu">${esc(x.year)}</span></span></button>`).join("")
  }catch{s.textContent="Die Suche ist gerade nicht erreichbar. Trag die Daten von Hand ein."}}
$("#sr").onclick=e=>{const b=e.target.closest("button");if(!b)return;const x=hits[b.dataset.i],f=F(),un=[];
  f.title.value=x.title;f.cover.value=x.big||"";pv(x.big);if(x.eps)f.eps.value=x.eps;
  for(const g of x.genres){const v=GM[g]||g,ex=genres().find(y=>y.toLowerCase()===v.toLowerCase());
    if(ex){if(sel.size<5)sel.add(ex)}else if(GM[g]){if(sel.size<5)sel.add(v)}else un.push(g)}
  chips();$("#gs").innerHTML=un.length?`<span class="mu">Vorschläge:</span>`+un.map(g=>`<label data-s="${esc(g)}">+ ${esc(g)}</label>`).join(""):"";
  $("#sr").innerHTML="";$("#ss").textContent="Daten übernommen. Bitte kurz prüfen.";if(x.platform)f.platform.value=x.platform;if(x.steam){f.steam.value=x.steam;$("#sc").click()}};

const F=()=>$("#af").elements;
const pv=u=>{$("#pv").innerHTML=u?`<img src="${esc(u)}" alt="Vorschau" onerror="this.remove()">`:""};
function openForm(g){
  editId=g?g.id:null;const f=F(),gm=tab==="games";
  $("#af").reset();$("#ah").textContent=T[tab].one+(g?" bearbeiten":" eintragen");$("#asv").textContent=g?"Änderungen speichern":"Speichern";
  f.status.innerHTML=T[tab].st.map(x=>`<option>${x}</option>`).join("");
  $("#stw").classList.toggle("hid",!gm);
  [f.platform,f.hours].forEach(x=>x.classList.toggle("hid",!gm));f.eps.classList.toggle("hid",gm);
  f.platform.required=gm;f.eps.placeholder=tab==="series"?"Staffeln (optional)":"Folgen (optional)";
  if(g){for(const k of ["title","platform","status","cover"])f[k].value=g[k]||"";f.steam.value=g.steamId||"";f.hours.value=g.hours||"";f.eps.value=g.eps||""}
  sel=new Set(g?gl(g):[]);$("#sq").value="";$("#sr").innerHTML="";$("#gs").innerHTML="";$("#ng").value="";
  chips();$("#ss").textContent="";pv(g?.cover);$("#add").showModal();
}
$("#new").onclick=()=>openForm(null);
$("#ac").onclick=()=>$("#add").close();
$("#add").addEventListener("close",()=>{editId=null});
F().cover.oninput=e=>pv(e.target.value.trim());

$("#sc").onclick=async()=>{
  const id=parseApp(F().steam.value),s=$("#ss"),b=$("#sc");
  if(!id){s.textContent="Bitte einen Steam-Link (…/app/12345/…) oder eine AppID eintragen.";return}
  b.disabled=true;s.textContent="Suche bei Steam …";
  try{
    const r=await steamLookup(id);
    if(r.name&&!F().title.value.trim())F().title.value=r.name;
    if(r.cover){F().cover.value=r.cover;pv(r.cover);s.textContent="Cover gefunden ("+r.how+"). Titel und Angaben bitte prüfen."}
    else s.textContent=r.api?"Zu diesem Spiel gibt es bei Steam kein ladbares Cover. Trage eine Bild-Adresse von Hand ein.":"Steam war nicht erreichbar. Versuche es später noch einmal oder trage die Bild-Adresse von Hand ein."
  }catch(e){s.textContent="Fehler beim Abruf. Trage die Bild-Adresse von Hand ein."}
  finally{b.disabled=false}
};
F().steam.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("#sc").click()}});
F().steam.addEventListener("change",()=>{if(parseApp(F().steam.value))$("#sc").click()});

$("#af").onsubmit=async e=>{e.preventDefault();
  const f=F(),v=k=>f[k].value.trim(),b=$("#asv"),gm=tab==="games";b.disabled=true;
  try{
    const cover=v("cover");
    if(cover&&!/^https:\/\//i.test(cover))throw{message:"Die Cover-Adresse muss mit https:// beginnen."};
    if(cover&&!(await probe(cover))&&!confirm("Das Bild unter dieser Adresse lässt sich nicht laden. Trotzdem speichern?"))return;
    const data={title:v("title"),status:f.status.value,genres:[...sel],cover};
    if(gm){data.platform=v("platform");data.hours=v("hours")?+v("hours"):0;data.steamId=parseApp(v("steam"))||""}else data.eps=v("eps")?+v("eps"):0;
    if(editId)await updateDoc(doc(db,tab,editId),data);
    else await addDoc(collection(db,tab),{...data,addedBy:user.uid,addedByName:name(),createdAt:serverTimestamp()});
    $("#add").close();
  }catch(err){fail(err)}
  finally{b.disabled=false}
};

// Admin: Nutzer sperren, eigene Genres umbenennen/löschen
function admR(){$("#adm").innerHTML=`<h2>Nutzer</h2><p class="mu">Sperren blockiert nur das Schreiben (Firestore-Rules). Den Login selbst kannst du nur in der Firebase Console unter Authentication deaktivieren.</p>`+
  us.map(u=>`<div class="ur"><span>${esc(u.name)} <span class="mu">${esc(u.email)}${u.banned?" · gesperrt":""}</span></span>${u.id===user.uid?"":`<button data-b="${esc(u.id)}">${u.banned?"Entsperren":"Sperren"}</button>`}</div>`).join("")+
  `<h2 style="margin-top:28px">Eigene Genres</h2>`+(gen.length?gen.map(x=>`<div class="ur"><span>${esc(T[x.cat]?.n)}: ${esc(x.name)}</span><span><button data-r="${esc(x.id)}">Umbenennen</button> <button data-x="${esc(x.id)}">Löschen</button></span></div>`).join(""):`<p class="mu">Noch keine eigenen Genres.</p>`)+
  `<p class="mu">Einträge und Bewertungen bearbeitest oder löschst du direkt im jeweiligen Reiter.</p>`}
$("#adm").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  try{
    if(d.b){const u=us.find(x=>x.id===d.b);await updateDoc(doc(db,"users",d.b),{banned:!u.banned})}
    else if(d.r){const g=gen.find(x=>x.id===d.r),n=prompt("Neuer Name (ändert nur die Auswahlliste, nicht bestehende Einträge)",g.name);if(n&&n.trim().length>1)await updateDoc(doc(db,"genres",d.r),{name:n.trim().slice(0,30)})}
    else if(d.x&&confirm("Genre aus der Auswahl löschen?"))await deleteDoc(doc(db,"genres",d.x));
  }catch(err){fail(err)}};

const ok=()=>$("#lg").close(),err=e=>alert((e.code||e.message).replace("auth/",""));
$("#lc").onclick=ok;
$("#lf").onsubmit=e=>{e.preventDefault();signInWithEmailAndPassword(auth,$("#em").value,$("#pw").value).then(ok).catch(err)};
$("#rg").onclick=()=>{if($("#lf").reportValidity())createUserWithEmailAndPassword(auth,$("#em").value,$("#pw").value).then(ok).catch(err)};
$("#go").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).then(ok).catch(err);
$("#me").onclick=e=>{if(e.target.id==="lo")signOut(auth);if(e.target.id==="li")$("#lg").showModal()};
onAuthStateChanged(auth,async u=>{
  stop();user=u;adm=false;banned=false;if($("#det").open)$("#det").close();
  $("#me").innerHTML=u?`<span class="mu">${esc(name())}</span> <button id="lo">Abmelden</button>`:`<button id="li" class="pri">Anmelden</button>`;
  if(!u){tab="games";tabs();$("#new").style.display="none";["#bar","#adm"].forEach(s=>$(s).classList.add("hid"));$("#ban").classList.add("hid");$("#grid").classList.remove("hid");$("#grid").innerHTML=`<p class="mu">Bitte melde dich an, um die Einträge zu sehen.</p>`;return}
  try{const r=doc(db,"users",u.uid);if(!(await getDoc(r)).exists())await setDoc(r,{name:name(),email:u.email||"",createdAt:serverTimestamp(),banned:false});
    adm=(await getDoc(doc(db,"admins",u.uid))).exists()}catch(e){fail(e)}
  if(user!==u)return;
  start();setTab("games");
});
